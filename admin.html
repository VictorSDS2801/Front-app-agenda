<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Agenda Escolar</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

</head>
<body class="dashboard-body">
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1>🔧 Painel do Administrador</h1>
            <div class="user-info">
                <span id="userName"></span>
                <button id="logoutBtn" class="btn btn-logout">Sair</button>
            </div>
        </div>
    </header>

    <div class="container dashboard-container">
        <!-- Formulário de Criar/Editar Atividade -->
        <div class="admin-form-section">
            <h2 id="formTitle">➕ Nova Atividade</h2>
            <form id="activityForm" class="admin-form">
                <input type="hidden" id="activityId">
                
                <div class="form-row">
                    <div class="input-group">
                        <label for="subject">Matéria *</label>
                        <input type="text" id="subject" placeholder="Ex: Matemática" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="description">Descrição *</label>
                    <textarea id="description" rows="3" placeholder="Descreva a atividade..." required></textarea>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="issueDate">Data de Emissão *</label>
                        <input type="date" id="issueDate" required>
                    </div>

                    <div class="input-group">
                        <label for="dueDate">Data de Entrega *</label>
                        <input type="date" id="dueDate" required>
                    </div>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary" id="submitBtn">Criar Atividade</button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Filtros -->
        <div class="filters">
            <h3>Filtros</h3>
            <div class="filter-group">
                <input type="text" id="filterSubject" placeholder="Filtrar por matéria">
            </div>
            <div class="filter-group">
                <label>
                    <input type="checkbox" id="filterTomorrow">
                    Apenas atividades de amanhã
                </label>
            </div>
            <button id="applyFilters" class="btn btn-primary">Aplicar Filtros</button>
            <button id="clearFilters" class="btn btn-secondary">Limpar</button>
        </div>

        <!-- Lista de Atividades -->
        <div class="activities-section">
            <h2>Todas as Atividades</h2>
            <div id="activitiesList" class="activities-list admin-activities-list">
                <!-- Atividades serão inseridas aqui via JS -->
            </div>
            <div id="loadingMessage" class="loading">Carregando atividades...</div>
            <div id="emptyMessage" class="empty-message" style="display: none;">
                Nenhuma atividade cadastrada.
            </div>
        </div>
    </div>

    <!-- Modal de Confirmação de Exclusão -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <h3>⚠️ Confirmar Exclusão</h3>
            <p>Tem certeza que deseja excluir esta atividade?</p>
            <p class="modal-activity-name"></p>
            <div class="modal-buttons">
                <button id="confirmDelete" class="btn btn-danger">Excluir</button>
                <button id="cancelDelete" class="btn btn-secondary">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="./js/pwa.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
