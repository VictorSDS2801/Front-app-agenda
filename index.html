<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Agenda Escolar 1c</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1>Agenda Escolar 1c</h1>
            <p class="subtitle">Gerencie suas atividades diárias</p>

            <!-- Formulário de Login -->
            <form id="loginForm" class="form active">
                <h2>Login</h2>
                <div class="input-group">
                    <input type="text" id="loginUsername" placeholder="Usuário" required>
                </div>
                <div class="input-group">
                    <input type="password" id="loginPassword" placeholder="Senha" required>
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
                <p class="form-toggle">
                    Não tem conta? <a href="#" id="showRegister">Registre-se</a>
                </p>
            </form>

            <!-- Formulário de Registro -->
            <form id="registerForm" class="form">
                <h2>Criar Conta</h2>
                <div class="input-group">
                    <input type="text" id="registerUsername" placeholder="Usuário" required>
                </div>
                <div class="input-group">
                    <input type="password" id="registerPassword" placeholder="Senha (mín. 6 caracteres)" required>
                </div>
                <button type="submit" class="btn btn-primary">Registrar</button>
                <p class="form-toggle">
                    Já tem conta? <a href="#" id="showLogin">Faça login</a>
                </p>
            </form>

            <!-- Mensagens de erro/sucesso -->
            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="./js/pwa.js"></script>

</body>
</html>
