<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Estudante - Agenda Escolar</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

</head>
<body class="dashboard-body">
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1>📚 Minhas Atividades</h1>
            <div class="user-info">
                <span id="userName"></span>
                <button id="logoutBtn" class="btn btn-logout">Sair</button>
            </div>
        </div>
    </header>

    <!-- Filtros -->
    <div class="container dashboard-container">
        <div class="filters">
            <h3>Filtros</h3>
            <div class="filter-group">
                <input type="text" id="filterSubject" placeholder="Filtrar por matéria">
            </div>
            <div class="filter-group">
                <label>
                    <input type="checkbox" id="filterTomorrow">
                    Apenas atividades de amanhã
                </label>
            </div>
            <div class="filter-group">
                <label>
                    <input type="checkbox" id="showCompleted">
                    Mostrar atividades feitas
                </label>
            </div>
            <button id="applyFilters" class="btn btn-primary">Aplicar Filtros</button>
            <button id="clearFilters" class="btn btn-secondary">Limpar</button>
        </div>        

        <!-- Lista de Atividades -->
        <div class="activities-section">
            <h2>Suas Atividades</h2>
            <div id="activitiesList" class="activities-list">
                <!-- Atividades serão inseridas aqui via JS -->
            </div>
            <div id="loadingMessage" class="loading">Carregando atividades...</div>
            <div id="emptyMessage" class="empty-message" style="display: none;">
                Nenhuma atividade encontrada.
            </div>
        </div>
    </div>

    <script src="js/student.js?v=3241413"></script>
    <script src="./js/pwa.js"></script>
</body>
</html>
